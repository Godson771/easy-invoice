
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyInvoice - Invoice Generator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f5f9;
  color: #202b3c;
}

header {
  background: #172b4d;
  color: white;
  padding: 22px 8%;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin-bottom: 0;
  color: #cbd5e1;
}

.container {
  max-width: 1100px;
  margin: 30px auto;
  padding: 0 18px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
}

.panel {
  background: white;
  padding: 24px;
  border-radius: 12px;
  box-shadow: 0 3px 15px #00000008;
}

h2 {
  font-size: 19px;
  margin-top: 0;
}

label {
  display: block;
  font-size: 13px;
  margin: 14px 0 6px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 11px;
  border: 1px solid #dce1e9;
  border-radius: 6px;
  font-size: 14px;
}

.item {
  display: grid;
  grid-template-columns: 2fr 0.7fr 1fr auto;
  gap: 7px;
  margin: 10px 0;
}

button {
  padding: 12px 16px;
  border: 0;
  border-radius: 6px;
  background: #2563eb;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #1d4ed8;
}

.remove {
  background: #dc2626;
  padding: 8px;
}

.secondary {
  background: #64748b;
  margin-top: 12px;
}

#preview {
  padding: 20px;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  background: white;
}

.preview-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.preview-head h2 {
  color: #2563eb;
  font-size: 25px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 22px;
  font-size: 13px;
}

th, td {
  border-bottom: 1px solid #e5e7eb;
  padding: 10px 5px;
  text-align: left;
}

.totals {
  text-align: right;
  margin-top: 20px;
  line-height: 2;
}

.grand {
  font-size: 20px;
  font-weight: bold;
  color: #2563eb;
}

#printBtn {
  width: 100%;
  margin-top: 20px;
}

@media(max-width: 750px) {
  .container {
    grid-template-columns: 1fr;
  }
}

@media print {
  body {
    background: white;
  }

  header, .form-panel, #printBtn {
    display: none !important;
  }

  .container {
    display: block;
    margin: 0;
    padding: 0;
  }

  .panel {
    box-shadow: none;
    padding: 0;
  }

  #preview {
    border: none;
  }
}
</style>
</head>

<body>

<header>
  <h1>EasyInvoice</h1>
  <p>Create professional invoices in minutes.</p>
</header>

<main class="container">

<section class="panel form-panel">
  <h2>Create Your Invoice</h2>

  <label>Business Name</label>
  <input id="business" placeholder="Your business name">

  <label>Business Email</label>
  <input id="email" type="email" placeholder="you@example.com">

  <label>Customer Name</label>
  <input id="customer" placeholder="Customer name">

  <label>Invoice Number</label>
  <input id="invoiceNo" value="INV-001">

  <label>Invoice Date</label>
  <input id="invoiceDate" type="date">

  <label>Currency</label>
  <select id="currency">
    <option value="NGN">Nigerian Naira (NGN)</option>
    <option value="USD">US Dollar (USD)</option>
    <option value="GBP">British Pound (GBP)</option>
    <option value="EUR">Euro (EUR)</option>
  </select>

  <h2 style="margin-top:25px">Products or Services</h2>

  <div id="items"></div>

  <button type="button" onclick="addItem()">
    + Add Item
  </button>

  <label>Tax (%)</label>
  <input id="tax" type="number" min="0" value="0">

  <button type="button" class="secondary"
    onclick="updateInvoice()">
    Update Invoice
  </button>
</section>

<section class="panel">
  <h2>Invoice Preview</h2>

  <div id="preview">
    <div class="preview-head">
      <div>
        <h2>INVOICE</h2>
        <p id="pBusiness">Your Business</p>
        <p id="pEmail">Your email</p>
      </div>

      <div>
        <p><b>Invoice:</b> <span id="pNumber">INV-001</span></p>
        <p><b>Date:</b> <span id="pDate">-</span></p>
      </div>
    </div>

    <hr>

    <h3>Bill To</h3>
    <p id="pCustomer">Customer Name</p>

    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>Price</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="pItems"></tbody>
    </table>

    <div class="totals">
      <div>Subtotal: <span id="subtotal"></span></div>
      <div>Tax: <span id="pTax"></span></div>
      <div class="grand">
        Total: <span id="grandTotal"></span>
      </div>
    </div>

    <p style="margin-top:40px">
      Thank you for your business!
    </p>
  </div>

  <button id="printBtn" onclick="window.print()">
    Download / Print Invoice
  </button>
</section>

</main>

<script>
const $ = id => document.getElementById(id);

function addItem() {
  const div = document.createElement("div");
  div.className = "item";

  div.innerHTML = `
    <input class="description"
      placeholder="Product or service">
    <input class="quantity"
      type="number" min="0" value="1">
    <input class="price"
      type="number" min="0" value="0">
    <button type="button" class="remove">X</button>
  `;

  div.querySelector(".remove").onclick = () => {
    div.remove();
    updateInvoice();
  };

  div.querySelectorAll("input").forEach(input => {
    input.addEventListener("input", updateInvoice);
  });

  $("items").appendChild(div);
  updateInvoice();
}

function money(amount) {
  return new Intl.NumberFormat("en", {
    style: "currency",
    currency: $("currency").value
  }).format(amount);
}

function updateInvoice() {
  $("pBusiness").textContent =
    $("business").value || "Your Business";

  $("pEmail").textContent =
    $("email").value || "Your email";

  $("pCustomer").textContent =
    $("customer").value || "Customer Name";

  $("pNumber").textContent =
    $("invoiceNo").value || "INV-001";

  $("pDate").textContent =
    $("invoiceDate").value || "-";

  let subtotal = 0;
  $("pItems").innerHTML = "";

  document.querySelectorAll(".item").forEach(row => {
    const description =
      row.querySelector(".description").value || "Item";

    const quantity = Math.max(
      0, Number(row.querySelector(".quantity").value) || 0
    );

    const price = Math.max(
      0, Number(row.querySelector(".price").value) || 0
    );

    const total = quantity * price;
    subtotal += total;

    const tr = document.createElement("tr");

    [description, quantity, money(price), money(total)]
      .forEach(value => {
        const td = document.createElement("td");
        td.textContent = value;
        tr.appendChild(td);
      });

    $("pItems").appendChild(tr);
  });

  const taxRate = Math.max(0, Number($("tax").value) || 0);
  const taxAmount = subtotal * taxRate / 100;
  const total = subtotal + taxAmount;

  $("subtotal").textContent = money(subtotal);
  $("pTax").textContent = money(taxAmount);
  $("grandTotal").textContent = money(total);
}

[
  "business", "email", "customer", "invoiceNo",
  "invoiceDate", "currency", "tax"
].forEach(id => {
  $(id).addEventListener("input", updateInvoice);
  $(id).addEventListener("change", updateInvoice);
});

addItem();

</script>

</body>
</html>
